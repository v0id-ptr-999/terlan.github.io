<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tərlanın Ailəsi — Gəncə 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#a9d8e6;
    --sky-mid:#cfe9dd;
    --sky-bottom:#eef4e2;
    --brown:#3d2c1f;
    --muted:#6b5a45;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%;
    max-width:100vw;
    background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 45%, var(--sky-bottom) 85%);
    font-family:'Nunito', sans-serif;
    color: var(--brown);
    overflow-x:hidden;
    position:relative;
  }
  header.hero{ text-align:center; padding: 15px 20px 2px; }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size: clamp(22px, 4.5vw, 36px);
    margin:0;
  }
  .sub{ color:var(--muted); margin-top:2px; font-size:12px; }

  .nav-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 10px 0;
    z-index: 20;
    position: relative;
    flex-wrap: wrap;
  }
  .nav-btn {
    background: #fbf6ea;
    border: 2px solid #5c7a3f;
    border-radius: 6px;
    padding: 5px 14px;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--brown);
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(61,44,31,.2);
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .nav-btn.active, .nav-btn:hover {
    background: #5c7a3f;
    color: #fff;
  }

  .tree-clip{ 
    width: 100%; 
    max-width: 1000px; 
    margin: 0 auto; 
    overflow: visible; 
    position: relative;
  }
  .tree-wrap{ 
    position: relative; 
    width: 100%; 
    height: auto; 
  }
  .tree-wrap svg{ 
    display: block; 
    width: 100%; 
    height: auto; 
    overflow: visible; 
  }

  .placard{
    position:absolute; 
    transform: translate(-50%, 0);
    display:flex; 
    flex-direction:column; 
    align-items:center;
    z-index: 5;
  }
  .placard .thread{ width:1px; height:10px; background: #6b5a45; }
  .placard .board{
    margin-top:-1px; background:#fbf6ea; border:1px solid #8a6d45; border-radius: 4px;
    padding: 3px 6px; text-align:center; box-shadow: 0 2px 4px rgba(61,44,31,.2);
    white-space:nowrap; line-height:1.1;
  }
  .placard .t-name{ font-weight:800; font-size: clamp(6px, 0.85vw, 10px); color: var(--brown); }
  .placard .t-rel{ font-size: clamp(4.5px, 0.6vw, 7.5px); color: var(--muted); font-weight:600; }
  
  .placard.root .board{ border-width:2px; border-color:#5e4020; padding: 5px 10px; }
  .placard.root .t-name{ font-size: clamp(9px, 1.2vw, 13px); color:#4a3320; }
  .placard.root .thread{ height:14px; }

  @keyframes rainbowShift {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  .rainbow-text {
    background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900 !important;
    animation: rainbowShift 4s linear infinite;
  }

  .region-label{
    position:absolute; transform: translate(-50%, -50%);
    font-family:'Playfair Display', serif; font-weight:900; font-size: clamp(14px, 2.5vw, 22px);
    letter-spacing:2px; color: #4a3320cc;
    z-index: 4;
  }

  .banner{
    position:relative;
    width: max-content;
    margin: 10px auto 20px auto;
    background:#fbf6ea;
    border:2px solid #5c7a3f;
    border-radius: 8px;
    padding: 6px 20px;
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size: clamp(14px, 3vw, 20px);
    color: var(--brown);
    box-shadow: 0 4px 10px rgba(61,44,31,.25);
    z-index:10;
    text-align: center;
  }
</style>
</head>
<body>

<header class="hero">
  <p class="sub">Tərlanın Sistemi</p>
  <h1>Ailə Ağacı</h1>
</header>

<div class="nav-buttons">
  <button class="nav-btn" onclick="switchBranch('baki')">Bakı</button>
  <button class="nav-btn" onclick="switchBranch('genca1')">Gəncə 1</button>
  <button class="nav-btn active" onclick="switchBranch('genca2')">Gəncə 2</button>
</div>

<div class="tree-clip">
<div class="tree-wrap" id="treeWrap">
  <svg viewBox="0 0 1000 1150" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="barkGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#8a8368"/>
        <stop offset="35%" stop-color="#b8ab84"/>
        <stop offset="60%" stop-color="#9c8e6a"/>
        <stop offset="100%" stop-color="#78714f"/>
      </linearGradient>
    </defs>

    <path d="M500 1040 C 470 1010, 440 1020, 410 1050" stroke="#6b6248" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M500 1040 C 530 1010, 560 1020, 590 1050" stroke="#6b6248" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M500 1040 C 485 1022, 475 1032, 468 1052" stroke="#6b6248" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M500 1040 C 515 1022, 525 1032, 532 1052" stroke="#6b6248" stroke-width="6" fill="none" stroke-linecap="round"/>

    <path d="M470 1040 C 464 900, 466 750, 478 620 C 470 590, 468 560, 474 540
            L 526 540 C 532 560, 530 590, 522 620 C 534 750, 538 900, 530 1040 Z" fill="url(#barkGrad)"/>

    <g id="barkPatches"></g>

    <g stroke="url(#barkGrad)" fill="none" stroke-linecap="round">
      <path d="M500 540 Q 500 400, 500 280" stroke-width="45"/>
      <path d="M500 320 Q 420 330, 350 380" stroke-width="16"/>
      <path d="M500 320 Q 580 330, 650 380" stroke-width="16"/>
    </g>

    <g id="leafLayer"></g>
  </svg>

  <div id="branchTitle" class="region-label" style="top:6%; left:50%;">GƏNCƏ 2</div>

  <div id="contentContainer"></div>
</div>
</div>

<div id="bannerText" class="banner">Tərlanın Çinarı — Gəncə 2</div>

<script>
const branches = {
  baki: {
    title: "BAKI",
    banner: "Tərlanın Çinarı — Bakı",
    placards: [
      { top: "15%", left: "50%", root: true, name: "Sabir & Gülzar", rel: "Babam & Nənəm" },
      { top: "25%", left: "28%", name: "İlqar", rel: "Atam" },
      { top: "21%", left: "50%", name: "Afət", rel: "Bibim" },
      { top: "25%", left: "72%", name: "Rüfət", rel: "Əmim" },
      { top: "36%", left: "20%", name: "Kənan", rel: "Qardaşım" },
      { top: "36%", left: "36%", name: "Şükran", rel: "Bacım" },
      { top: "35%", left: "50%", name: "Sənan", rel: "Qardaşım" },
      { top: "47%", left: "50%", name: "Hökümə", rel: "Gəlinim" },
      { top: "58%", left: "43%", name: "Məryəm", rel: "Qohum" },
      { top: "58%", left: "57%", name: "Qumru", rel: "Qohum" },
      { top: "36%", left: "72%", name: "Rəvan", rel: "Əmim Oğlu" }
    ]
  },
  genca1: {
    title: "GƏNCƏ",
    banner: "Tərlanın Çinarı — Gəncə",
    placards: [
      { top: "15%", left: "50%", root: true, name: "Əkbər & Yaqut", rel: "Babam & Nənəm" },
      { top: "25%", left: "35%", name: "Nunuş & Emil", rel: "Xalam & Əri" },
      { top: "25%", left: "65%", name: "Ələkbər & Aytən", rel: "Dayım & Yengəm" },
      { top: "37%", left: "28%", name: "İslam", rel: "Xalam Oğlu" },
      { top: "39%", left: "42%", name: "Fidan", rel: "Xalam Qızı" },
      { top: "37%", left: "58%", name: "Ayxan", rel: "Dayım Oğlu" },
      { top: "39%", left: "72%", name: "Mələk", rel: "Dayım Qızı" }
    ]
  },
  genca2: {
    title: "GƏNCƏ 2",
    banner: "Tərlanın Çinarı — Gəncə 2",
    placards: [
      /* Kök: Əsli & Məhəmməd (mərkəzə daha yaxın) */
      { top: "12%", left: "45%", root: true, name: "Əsli", rel: "Nənəm" },
      { top: "12%", left: "55%", root: true, name: "Məhəmməd", rel: "Babam" },

      /* Övladlar (Ağacın daxilində - 25% ilə 75% arası) */
      { top: "22%", left: "30%", name: "Nigar", rel: "Anam" },
      { top: "22%", left: "43%", name: "Süleyman", rel: "Dayım" },
      { top: "22%", left: "57%", name: "Sayalı", rel: "Xalam" },
      { top: "22%", left: "70%", name: "Aynur", rel: "Xalam" },

      /* Nigarın altı */
      { top: "33%", left: "30%", name: "Tərlan", rel: "Saytın Yaradıcısı", rainbow: true },

      /* Süleymanın altı */
      { top: "33%", left: "39%", name: "Ömər", rel: "Dayım Oğlu" },
      { top: "33%", left: "47%", name: "Uğur", rel: "Dayım Oğlu" },

      /* Sayalının altı */
      { top: "33%", left: "53%", name: "Xəyal", rel: "Xalam Oğlu" },
      { top: "33%", left: "61%", name: "Gülşən", rel: "Xalam Qızı" },

      /* Aynurun altı */
      { top: "33%", left: "67%", name: "Əli", rel: "Xalam Oğlu" },
      { top: "33%", left: "75%", name: "Tunar", rel: "Xalam Oğlu" }
    ]
  }
};

function switchBranch(branchKey) {
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  const data = branches[branchKey];
  document.getElementById('branchTitle').innerText = data.title;
  document.getElementById('bannerText').innerText = data.banner;

  const container = document.getElementById('contentContainer');
  container.innerHTML = '';

  data.placards.forEach(item => {
    const div = document.createElement('div');
    div.className = item.root ? 'placard root' : 'placard';
    div.style.top = item.top;
    div.style.left = item.left;
    div.innerHTML = `
      <div class="thread"></div>
      <div class="board">
        <div class="t-name ${item.rainbow ? 'rainbow-text' : ''}">${item.name}</div>
        <div class="t-rel">${item.rel}</div>
      </div>
    `;
    container.appendChild(div);
  });
}

window.onload = function() {
  const container = document.getElementById('contentContainer');
  branches.genca2.placards.forEach(item => {
    const div = document.createElement('div');
    div.className = item.root ? 'placard root' : 'placard';
    div.style.top = item.top;
    div.style.left = item.left;
    div.innerHTML = `
      <div class="thread"></div>
      <div class="board">
        <div class="t-name ${item.rainbow ? 'rainbow-text' : ''}">${item.name}</div>
        <div class="t-rel">${item.rel}</div>
      </div>
    `;
    container.appendChild(div);
  });
};

(function(){
  const svgNS = "http://www.w3.org/2000/svg";
  const leafLayer = document.getElementById('leafLayer');
  const barkPatchLayer = document.getElementById('barkPatches');

  const greens = ['#5a8f3e','#6ba84c','#4f7d36','#7cbf5e','#3f6b2c'];
  const autumn = ['#c9a13a','#b8863a'];

  function palmateLeaf(x, y, scale, angleDeg, color){
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('transform', `translate(${x} ${y}) rotate(${angleDeg}) scale(${scale})`);

    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', `
      M0,0
      C -2,-6 -5,-9 -11,-16
      C -6,-15 -3,-13 0,-10
      C -1,-15 -3,-20 -6,-27
      C -2,-23 1,-19 2,-14
      C 3,-19 6,-23 10,-27
      C 7,-20 5,-15 4,-10
      C 7,-13 10,-15 15,-16
      C 9,-9 6,-6 4,0
      C 6,4 9,7 15,10
      C 10,9 7,7 4,4
      C 5,9 7,14 10,20
      C 6,16 3,13 2,9
      C 1,13 -2,16 -6,20
      C -3,14 -1,9 0,4
      C -3,7 -6,9 -11,10
      C -5,7 -2,4 0,0
      Z`);
    path.setAttribute('fill', color);
    path.setAttribute('opacity', 0.92);

    const vein = document.createElementNS(svgNS, 'line');
    vein.setAttribute('x1', 0); vein.setAttribute('y1', 0);
    vein.setAttribute('x2', 0); vein.setAttribute('y2', -18);
    vein.setAttribute('stroke', 'rgba(0,0,0,.15)');
    vein.setAttribute('stroke-width', 0.8);

    g.appendChild(path);
    g.appendChild(vein);
    leafLayer.appendChild(g);
  }

  function inCrown(x, y){
    const lobes = [
      [500, 270, 320, 250]
    ];
    for(const [lx,ly,rx,ry] of lobes){
      const dx=(x-lx)/rx, dy=(y-ly)/ry;
      if(dx*dx+dy*dy<=1) return true;
    }
    return false;
  }

  let placed = 0, tries = 0;
  const target = 1400;
  while(placed < target && tries < target*20){
    tries++;
    const x = 180 + Math.random()*640;
    const y = 70 + Math.random()*520;
    if(!inCrown(x,y)) continue;
    const scale = 0.9 + Math.random() * 1.3;
    const angle = Math.random()*360;
    const isAutumn = Math.random() < 0.09;
    const palette = isAutumn ? autumn : greens;
    const color =palette[Math.floor(Math.random()*palette.length)];
    palmateLeaf(x, y, scale, angle, color);
    placed++;
  }

  const barkColors = ['#c9bd94','#8f8564','#6f6748','#b3a476','#5e5738'];
  const trunkXCenters = [480, 490, 500, 515, 525];
  for(let i = 0; i < 45; i++){
    const cx = trunkXCenters[Math.floor(Math.random()*trunkXCenters.length)] + (Math.random()*20 - 10);
    const cy = 600 + Math.random() * 420;
    const rx = 8 + Math.random() * 16;
    const ry = 10 + Math.random() * 20;
    const ellipse = document.createElementNS(svgNS, 'ellipse');
    ellipse.setAttribute('cx', cx);
    ellipse.setAttribute('cy', cy);
    ellipse.setAttribute('rx', rx);
    ellipse.setAttribute('ry', ry);
    ellipse.setAttribute('fill', barkColors[Math.floor(Math.random()*barkColors.length)]);
    ellipse.setAttribute('opacity', 0.5 + Math.random()*0.3);
    ellipse.setAttribute('transform', `rotate(${Math.random()*30-15} ${cx} ${cy})`);
    barkPatchLayer.appendChild(ellipse);
  }
})();
</script>

</body>
</html>
